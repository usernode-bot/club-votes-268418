<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <script>
  // usernode-dev-console@1
  (function () {
    if (window.__usernodeDevConsole) return;
    window.__usernodeDevConsole = true;
    var S = '__usernodeDevConsole';
    function serialize(v, depth) {
      depth = depth || 0;
      try {
        if (v === undefined) return 'undefined';
        if (v === null) return 'null';
        if (typeof v === 'string') return v;
        if (typeof v === 'number' || typeof v === 'boolean') return String(v);
        if (typeof v === 'function') return '[Function ' + (v.name || 'anonymous') + ']';
        if (v instanceof Error) return (v.stack || (v.name || 'Error') + ': ' + v.message);
        if (depth > 3) return '[…]';
        var seen = new WeakSet();
        return JSON.stringify(v, function (k, val) {
          if (typeof val === 'object' && val !== null) {
            if (seen.has(val)) return '[Circular]';
            seen.add(val);
          }
          if (typeof val === 'function') return '[Function ' + (val.name || 'anonymous') + ']';
          if (val instanceof Error) return val.stack || (val.name || 'Error') + ': ' + val.message;
          return val;
        });
      } catch (e) { try { return String(v); } catch (_) { return '[unserializable]'; } }
    }
    function post(level, args, meta) {
      try {
        var payload = {
          sentinel: S,
          level: level,
          args: Array.prototype.slice.call(args).map(function (a) { return serialize(a); }),
          ts: Date.now(),
          url: location.href,
        };
        if (meta) for (var k in meta) payload[k] = meta[k];
        if (window.parent && window.parent !== window) {
          window.parent.postMessage(payload, '*');
        }
      } catch (_) {}
    }
    ['log','info','warn','error','debug'].forEach(function (level) {
      var orig = console[level] ? console[level].bind(console) : function () {};
      console[level] = function () { post(level, arguments); orig.apply(null, arguments); };
    });
    window.addEventListener('error', function (e) {
      var msg = (e.error && (e.error.stack || e.error.message)) || e.message || 'Error';
      post('error', [msg], { source: e.filename || '', line: e.lineno || 0, col: e.colno || 0, kind: 'error' });
    });
    window.addEventListener('unhandledrejection', function (e) {
      var r = e.reason;
      var msg = (r && (r.stack || r.message)) || String(r);
      post('error', [msg], { kind: 'unhandledrejection' });
    });
    try { post('info', ['[dev-console ready]'], { kind: 'ready' }); } catch (_) {}
  })();
  </script>
  <title>Club Votes</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='45' fill='%23b03e26'/><circle cx='50' cy='50' r='18' fill='white'/></svg>">
  <!-- Tailwind, PRECOMPILED for this app (was cdn.tailwindcss.com's
       in-browser engine plus an inline tailwind.config here). The config
       moved to tailwind.config.js in the repo root; npm run build compiles
       it to public/tailwind.css with Docker or Paketo on every image build, so the
       stylesheet is regenerated from THIS commit's markup every deploy and
       can never drift behind the code. ~7 KB of CSS instead of a ~400 KB
       engine, and no flash of unstyled content.
       Writing class names as whole literals is what keeps this working — a
       class assembled from fragments at runtime (e.g. "bg-" + tone + "-500")
       is invisible to the compiler. If you genuinely need runtime-generated
       classes, swap this link for the platform-hosted engine instead:
       <script src="/usernode-tailwind/v1/tailwind.js"></script> -->
  <link rel="stylesheet" href="/tailwind.css">
  <link rel="stylesheet" href="/screens.css">
  <!-- The platform bridge, centrally hosted and loaded by RELATIVE path (the
       handler in server.js serves it under a plain "node server.js"; the
       platform's edge answers it everywhere else). Never vendor it and never
       write a hostname in front of it.
       It is NOT conditional on this app calling a bridge API: it is also how
       the app ANSWERS the shell, so a scaffold without it is invisible to
       anything that asks the frame a question. Offline launch is one of those.
       Another is the page's colour: the bridge reports this document's opaque
       ground to the shell (#1581), which is what makes the platform bar above
       the app take the app's tone instead of the viewer's theme (#1945).
       The bridge is also where the app learns the viewer's light/dark theme:
       the script below reads it. -->
  <script src="/usernode-bridge/v1/bridge.js"></script>
  <!-- Follow the viewer's Homeroom theme (the bridge reports it), with the
       OS preference as the fallback outside Homeroom. -->
  <script>
    (function () {
      var media = window.matchMedia('(prefers-color-scheme: dark)');
      function applyTheme() {
        var theme = (window.usernode && window.usernode.theme) || (media.matches ? 'dark' : 'light');
        document.documentElement.classList.toggle('dark', theme === 'dark');
        document.documentElement.style.colorScheme = theme;
      }
      applyTheme();
      window.addEventListener('usernode:theme-changed', applyTheme);
      media.addEventListener('change', applyTheme);
    })();
  </script>
</head>
<body class="min-h-screen bg-ground text-fg">
  <div data-spec-screen="1"><div class="app" id="app"></div></div>
  <script>
  (function () {
    'use strict';
    // ── Small helpers ────────────────────────────────────────────────────
    var TOKEN = new URLSearchParams(location.search).get('token') || '';
    var DEMO = new URLSearchParams(location.search).get('demo') === '1';
    var app = document.getElementById('app');

    function esc(s) {
      return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
        return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
      });
    }
    function relTime(iso) {
      if (!iso) return '';
      var s = (Date.now() - new Date(iso).getTime()) / 1000;
      if (s < 0) s = 0;
      if (s < 3600) return Math.max(1, Math.round(s / 60)) + 'm ago';
      if (s < 86400) return Math.round(s / 3600) + 'h ago';
      if (s < 172800) return 'Yesterday';
      var d = Math.round(s / 86400);
      if (d < 7) return d + ' days ago';
      return new Date(iso).toLocaleDateString();
    }
    function api(path, opts) {
      opts = opts || {};
      var headers = opts.headers || {};
      if (TOKEN) headers['x-usernode-token'] = TOKEN;
      if (opts.body) headers['Content-Type'] = 'application/json';
      var q = DEMO ? (path.indexOf('?') >= 0 ? '&' : '?') + 'demo=1' : '';
      return fetch('/api/' + path + q, {
        method: opts.method || 'GET',
        headers: headers,
        body: opts.body ? JSON.stringify(opts.body) : undefined,
      }).then(function (res) {
        return res.json().catch(function () { return null; }).then(function (data) {
          if (!res.ok) {
            var err = new Error((data && data.error) || ('Request failed (' + res.status + ')'));
            err.status = res.status;
            throw err;
          }
          return data;
        });
      });
    }

    var ICONS = {
      plus: '<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
      bubble: '<svg viewBox="0 0 24 24"><path d="M21 12a8 8 0 0 1-11.6 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg>',
      back: '<svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg>',
    };

    // ── The bar for one option: the drawn .opt / .bar markup ────────────
    function barHtml(opt, total, mine, selectable, selected) {
      var pct = total ? Math.round((opt.count / total) * 100) : 0;
      var cls = 'list-row' + (selected ? ' sel' : '');
      var olCls = 'ol' + (mine ? ' mine' : '');
      return '<div class="' + cls + '"' + (selectable ? ' data-option="' + esc(opt.id) + '" role="radio" aria-checked="' + (selected ? 'true' : 'false') + '"' : '') + '>'
        + (selectable ? '<span class="dot"></span>' : '')
        + '<div class="grow"><div class="' + olCls + '"><span>' + esc(opt.label) + '</span><b>' + opt.count + '</b></div>'
        + '<div class="bar"><i class="' + (opt.lead ? 'lead' : '') + '" style="width:' + pct + '%"></i></div></div></div>';
    }

    function nameOf(d) { return d.mine ? 'You' : d.authorName; }

    // ── Home: the club's open decisions, then recently decided ──────────
    var homeTab = 'open';
    var homeData = null;

    function skeletonCard() {
      return '<div class="card">'
        + '<div class="skeleton" style="height:14px;width:45%"></div>'
        + '<div class="skeleton" style="height:22px;width:85%;margin:10px 0 14px"></div>'
        + '<div class="skeleton" style="height:14px;width:60%;margin-bottom:6px"></div>'
        + '<div class="skeleton" style="height:8px;margin-bottom:10px"></div>'
        + '<div class="skeleton" style="height:14px;width:55%;margin-bottom:6px"></div>'
        + '<div class="skeleton" style="height:8px;margin-bottom:10px"></div>'
        + '<div class="skeleton" style="height:14px;width:70%"></div>'
        + '</div>';
    }

    function decidedCard(d) {
      var r = d.result;
      var line = '';
      if (r && r.type === 'tie') {
        line = 'Tie: ' + r.labels.map(esc).join(' and ') + ', ' + r.count + ' votes each';
      } else if (r) {
        line = 'Winner: ' + esc(r.labels[0]) + ', ' + r.count + ' of ' + r.totalVotes + ' votes';
      }
      return '<a class="card" style="display:block;text-decoration:none;color:inherit" href="#/d/' + esc(d.id) + '">'
        + '<div class="meta"><span>Posted by ' + esc(nameOf(d)) + '</span><span class="done">Decided</span></div>'
        + '<div class="q" style="font-size:16px;line-height:24px;margin-bottom:4px">' + esc(d.question) + '</div>'
        + (line ? '<div class="meta"><span>' + line + '</span></div>' : '')
        + '</a>';
    }

    function openCard(d) {
      var max = Math.max.apply(null, d.options.map(function (o) { return o.count; }).concat([0]));
      var btn;
      if (d.mine) btn = '<button class="btn-secondary" data-act="close" data-id="' + esc(d.id) + '">Close vote</button>';
      else if (d.myOptionId) btn = '<button class="btn-secondary" data-act="open" data-id="' + esc(d.id) + '">Change vote</button>';
      else btn = '<button class="btn-secondary" data-act="open" data-id="' + esc(d.id) + '">Vote</button>';
      return '<div class="card" data-card="' + esc(d.id) + '" role="button" tabindex="0" style="cursor:pointer">'
        + '<div class="meta"><span>Posted by ' + esc(nameOf(d)) + '</span><span>' + relTime(d.createdAt) + '</span></div>'
        + '<div class="q">' + esc(d.question) + '</div>'
        + d.options.map(function (o) {
            return '<div class="opt"><div class="ol' + (o.id === d.myOptionId ? ' mine' : '') + '"><span>' + esc(o.label) + '</span><b>' + o.count + '</b></div>'
              + '<div class="bar"><i class="' + (o.lead ? 'lead' : '') + '" style="width:' + (d.totalVotes ? Math.round(o.count / d.totalVotes * 100) : 0) + '%"></i></div></div>';
          }).join('')
        + '<div class="foot"><div class="foot-counts"><span>' + d.totalVotes + ' votes</span>'
        + '<span>' + ICONS.bubble + d.commentCount + '</span></div>' + btn + '</div>'
        + '</div>';
    }

    function renderHome() {
      var d = homeData;
      var open = d.decisions.filter(function (x) { return !x.closedAt; });
      var closed = d.decisions.filter(function (x) { return x.closedAt; });
      var empty = open.length === 0 && closed.length === 0;
      var html = '<div class="top"><h1>Club Votes</h1>'
        + '<p>' + (d.openCount === 0
            ? 'No open decisions'
            : d.openCount + ' open decision' + (d.openCount === 1 ? '' : 's') + ', '
              + d.needsMyVote + (d.needsMyVote === 1 ? ' needs' : ' need') + ' your vote')
        + '</p>'
        + (d.demo ? '<p class="demo-note" data-usernode-demo-note>Staging demo</p>' : '')
        + '</div>';
      if (empty) {
        html += '<div class="state-empty"><h2 style="font-size:20px;font-weight:600;margin:0">Nothing to decide yet</h2>'
          + '<p style="color:rgb(var(--muted));margin:0">Post the first thing the club needs to decide.</p>'
          + '<button class="btn-primary" data-act="new" style="margin-top:8px">Post a decision</button></div>';
      } else {
        html += '<div class="tabs">'
          + '<button class="tab' + (homeTab === 'open' ? ' on' : '') + '" data-tab="open">Open ' + d.openCount + '</button>'
          + '<button class="tab' + (homeTab === 'closed' ? ' on' : '') + '" data-tab="closed">Decided ' + closed.length + '</button></div>';
        if (homeTab === 'open') {
          html += open.length
            ? open.map(openCard).join('')
            : '<p class="section-label" style="padding:8px 4px">No open decisions right now. See Decided for the results.</p>';
          if (open.length && closed.length) {
            html += '<div class="section-label">Recently decided</div>' + closed.slice(0, 2).map(decidedCard).join('');
          }
        } else {
          html += closed.length ? closed.map(decidedCard).join('')
            : '<p class="section-label" style="padding:8px 4px">Nothing decided yet.</p>';
        }
      }
      html += empty ? '' : '<div class="fab" role="button" tabindex="0" aria-label="Post a decision" data-act="new">' + ICONS.plus + '</div>';
      app.innerHTML = html;
    }

    function showHome() {
      app.innerHTML = '<div class="top"><h1>Club Votes</h1><p class="skeleton" style="height:14px;width:220px"></p></div>'
        + skeletonCard() + skeletonCard() + skeletonCard();
      api('decisions').then(function (data) {
        homeData = data;
        renderHome();
      }).catch(function () {
        app.innerHTML = '<div class="top"><h1>Club Votes</h1><p></p></div>'
          + '<div class="state-error"><h2 style="font-size:20px;font-weight:600;margin:0">The decisions could not be loaded</h2>'
          + '<p style="color:rgb(var(--muted));margin:0">Nothing you posted is lost. Check your connection and try again.</p>'
          + '<button class="btn-secondary" data-act="retry" style="margin-top:8px">Retry</button></div>';
      });
    }

    // ── Decision detail: vote, comments, report ─────────────────────────
    var detail = null; // the loaded decision
    var selectedOption = null;
    var deleteArmed = false;
    var reported = false;

    function commentHtml(c) {
      return '<div class="c"><div class="ch"><b>' + esc(c.mine ? 'You' : c.authorName) + '</b><span class="meta">' + relTime(c.createdAt) + '</span></div>'
        + '<p>' + esc(c.body) + '</p>'
        + '<button class="rep" data-act="' + (c.mine ? 'del-comment' : 'report-comment') + '" data-id="' + esc(c.id) + '">'
        + (c.mine ? 'Delete' : 'Report') + '</button></div>';
    }

    function voteAreaHtml() {
      var d = detail;
      if (d.closedAt) {
        var r = d.result;
        var line = '';
        if (r && r.type === 'tie') line = 'Tie: ' + r.labels.map(esc).join(' and ') + ', ' + r.count + ' votes each';
        else if (r) line = 'Winner: ' + esc(r.labels[0]) + ', ' + r.count + ' of ' + r.totalVotes + ' votes';
        return (line ? '<div class="meta" style="margin:-8px 0 12px"><span class="done">' + line + '</span></div>' : '')
          + '<div class="row"><span class="meta">' + d.totalVotes + ' votes</span><span class="done">Closed</span></div>';
      }
      var sel = d.options.find(function (o) { return o.id === selectedOption; });
      var btnHtml;
      if (!sel) {
        btnHtml = '<span class="btn-primary" style="opacity:.5">Pick an option</span>';
      } else if (d.myOptionId === sel.id) {
        btnHtml = '<span class="btn-primary" style="background:rgb(var(--ok));color:rgb(var(--ground))">Your vote is ' + esc(sel.label) + '</span>';
      } else {
        btnHtml = '<button class="btn-primary" data-act="vote">Vote for ' + esc(sel.label) + '</button>';
      }
      return '<div class="row"><span class="meta">' + d.totalVotes + ' votes so far</span>' + btnHtml + '</div>';
    }

    function renderDetail() {
      var d = detail;
      var metaLine = d.closedAt
        ? 'Posted by ' + esc(nameOf(d)) + ', ' + relTime(d.createdAt) + '. Closed ' + relTime(d.closedAt) + '.'
        : 'Posted by ' + esc(nameOf(d)) + ', ' + relTime(d.createdAt) + '. Open until ' + esc(nameOf(d)) + (d.mine ? ' close it' : ' closes it') + '.';
      var myActions = '';
      if (d.mine && !d.closedAt) {
        myActions = '<div class="row"><button class="btn-secondary" data-act="close">Close vote</button>'
          + '<button class="rep" data-act="del-decision">' + (deleteArmed ? 'Really delete? Tap again' : 'Delete decision') + '</button></div>';
      }
      app.innerHTML = '<div class="app-inner">'
        + '<div class="bk"><a class="icon" href="#/">' + ICONS.back + 'All decisions</a>'
        + '<button class="icon rep" data-act="report-decision">' + (reported ? 'Reported, thanks' : 'Report') + '</button></div>'
        + '<div class="meta">' + metaLine + '</div>'
        + '<h1>' + esc(d.question) + '</h1>'
        + '<div class="list" id="opts">'
        + d.options.map(function (o) {
            return barHtml(o, d.totalVotes, o.id === d.myOptionId, !d.closedAt, o.id === selectedOption);
          }).join('')
        + '</div>'
        + voteAreaHtml()
        + myActions
        + '<div class="section-label">Comments ' + d.comments.length + '</div>'
        + '<div class="list" id="comments">'
        + (d.comments.length ? d.comments.map(commentHtml).join('')
            : '<div class="c"><p style="color:rgb(var(--muted))">No comments yet. Say what you think below.</p></div>')
        + '</div>'
        + '<div class="lbl">Add a comment</div>'
        + '<input class="field" id="comment-input" placeholder="e.g. I can bring the projector">'
        + '<button class="btn-secondary" data-act="post-comment">Post comment</button>'
        + '</div>';
    }

    function loadDetail(id) {
      app.innerHTML = '<div class="bk"><a class="icon" href="#/">' + ICONS.back + 'All decisions</a></div>'
        + '<div class="skeleton" style="height:14px;width:60%;margin:8px 0"></div>'
        + '<div class="skeleton" style="height:28px;width:85%;margin-bottom:16px"></div>'
        + '<div class="skeleton" style="height:64px"></div><div class="skeleton" style="height:64px;margin-top:8px"></div>';
      api('decisions/' + encodeURIComponent(id)).then(function (data) {
        detail = data;
        selectedOption = data.myOptionId;
        deleteArmed = false;
        reported = false;
        renderDetail();
      }).catch(function () {
        app.innerHTML = '<div class="bk"><a class="icon" href="#/">' + ICONS.back + 'All decisions</a></div>'
          + '<div class="state-error"><h2 style="font-size:20px;font-weight:600;margin:0">The decision could not be loaded</h2>'
          + '<p style="color:rgb(var(--muted));margin:0">Nothing you posted is lost. Check your connection and try again.</p>'
          + '<button class="btn-secondary" data-act="retry-detail" data-id="' + esc(id) + '" style="margin-top:8px">Retry</button></div>';
      });
    }

    // ── New decision form ────────────────────────────────────────────────
    var NEW_OPT_PLACEHOLDERS = ['e.g. Library back room', 'e.g. Corner cafe', "e.g. Dan's garage"];
    var newOpts = ['', ''];

    function optRowHtml(value, i) {
      // The two required options cannot be removed: the × only shows once a
      // third row exists, and without it the field runs the full width.
      var removable = newOpts.length > 2;
      return '<div class="new-opt">'
        + '<input class="field new-opt-input" placeholder="' + NEW_OPT_PLACEHOLDERS[i % NEW_OPT_PLACEHOLDERS.length] + '" value="' + esc(value || '') + '">'
        + (removable ? '<button class="rep" data-act="remove-opt" data-idx="' + i + '" aria-label="Remove option">✕</button>' : '')
        + '</div>';
    }

    function renderNewOpts() {
      document.getElementById('new-opts').innerHTML =
        newOpts.map(function (v, i) { return optRowHtml(v, i); }).join('');
    }

    // Keep typed values across the re-render that adding or removing a row does.
    function syncNewOpts() {
      var inputs = document.querySelectorAll('.new-opt-input');
      for (var i = 0; i < newOpts.length && i < inputs.length; i++) newOpts[i] = inputs[i].value;
    }

    function showNew() {
      newOpts = ['', ''];
      app.innerHTML = '<div class="bk"><button class="icon" data-act="cancel-new">Cancel</button>'
        + '<strong style="font-size:16px">Post a decision</strong>'
        + '<button class="btn-primary" data-act="submit-new" style="min-height:44px">Post</button></div>'
        + '<div class="lbl">Question</div>'
        + '<input class="field" id="new-question" placeholder="e.g. Where should we meet this month?" style="margin:8px 0 16px">'
        + '<div class="lbl">Options</div>'
        + '<div id="new-opts">' + newOpts.map(function (v, i) { return optRowHtml(v, i); }).join('') + '</div>'
        + '<button class="btn-secondary" data-act="add-opt" style="margin:8px 0">Add option</button>'
        + '<p id="new-error" class="meta" style="display:none;color:rgb(var(--accent))"></p>';
    }

    // ── Actions ──────────────────────────────────────────────────────────
    function refreshDetail() { loadDetail(detail.id); }

    function act(el) {
      var a = el.getAttribute('data-act');
      if (a === 'tab') {
        homeTab = el.getAttribute('data-tab');
        renderHome();
      } else if (a === 'new' || a === 'cancel-new') {
        location.hash = '#/new';
      } else if (a === 'retry') {
        showHome();
      } else if (a === 'retry-detail') {
        loadDetail(el.getAttribute('data-id'));
      } else if (a === 'open') {
        location.hash = '#/d/' + el.getAttribute('data-id');
      } else if (a === 'close') {
        api('decisions/' + el.getAttribute('data-id') + '/close', { method: 'POST', body: {} })
          .then(function () { showHome(); })
          .catch(function (e) { console.warn(e.message); showHome(); });
      } else if (a === 'vote') {
        api('decisions/' + detail.id + '/vote', { method: 'POST', body: { optionId: selectedOption } })
          .then(refreshDetail)
          .catch(function (e) { console.warn(e.message); });
      } else if (a === 'report-decision') {
        if (reported) return;
        api('reports', { method: 'POST', body: { kind: 'decision', targetId: detail.id } })
          .then(function () { reported = true; renderDetail(); })
          .catch(function (e) { console.warn(e.message); });
      } else if (a === 'report-comment') {
        api('reports', { method: 'POST', body: { kind: 'comment', targetId: el.getAttribute('data-id') } })
          .then(function () { el.textContent = 'Reported, thanks'; el.removeAttribute('data-act'); })
          .catch(function (e) { console.warn(e.message); });
      } else if (a === 'del-comment') {
        api('comments/' + el.getAttribute('data-id'), { method: 'DELETE' })
          .then(refreshDetail)
          .catch(function (e) { console.warn(e.message); });
      } else if (a === 'del-decision') {
        if (!deleteArmed) { deleteArmed = true; renderDetail(); return; }
        api('decisions/' + detail.id, { method: 'DELETE' })
          .then(function () { location.hash = '#/'; })
          .catch(function (e) { console.warn(e.message); });
      } else if (a === 'post-comment') {
        var input = document.getElementById('comment-input');
        var body = input.value.trim();
        if (!body) { input.focus(); return; }
        api('decisions/' + detail.id + '/comments', { method: 'POST', body: { body: body } })
          .then(refreshDetail)
          .catch(function (e) { console.warn(e.message); });
      } else if (a === 'add-opt') {
        syncNewOpts();
        if (newOpts.length < 8) { newOpts.push(''); renderNewOpts(); }
      } else if (a === 'remove-opt') {
        syncNewOpts();
        newOpts.splice(Number(el.getAttribute('data-idx')), 1);
        renderNewOpts();
      } else if (a === 'submit-new') {
        var question = document.getElementById('new-question').value.trim();
        var opts = Array.prototype.map.call(document.querySelectorAll('.new-opt-input'), function (i) { return i.value.trim(); })
          .filter(Boolean);
        api('decisions', { method: 'POST', body: { question: question, options: opts } })
          .then(function () { location.hash = '#/'; })
          .catch(function (e) {
            var err = document.getElementById('new-error');
            err.textContent = e.message;
            err.style.display = 'block';
          });
      }
    }

    // ── Events ───────────────────────────────────────────────────────────
    app.addEventListener('click', function (ev) {
      var el = ev.target.closest('[data-act]');
      if (el) {
        ev.stopPropagation();
        act(el);
        return;
      }
      var row = ev.target.closest('[data-option]');
      if (row) {
        selectedOption = row.getAttribute('data-option');
        renderDetail();
        return;
      }
      var card = ev.target.closest('[data-card]');
      if (card) location.hash = '#/d/' + card.getAttribute('data-card');
    });
    app.addEventListener('keydown', function (ev) {
      if (ev.key !== 'Enter' && ev.key !== ' ') return;
      var el = ev.target;
      if (el.matches('[data-act]') || el.matches('[data-card]')) {
        ev.preventDefault();
        if (el.matches('[data-act]')) act(el);
        else location.hash = '#/d/' + el.getAttribute('data-card');
      }
    });
    app.addEventListener('input', function () {}); // keeps the listener cheap
    window.addEventListener('keydown', function (ev) {
      // Enter posts the comment or the form from its last field.
      if (ev.key !== 'Enter' || ev.target.tagName !== 'INPUT') return;
      if (ev.target.id === 'comment-input') {
        ev.preventDefault();
        var btn = app.querySelector('[data-act="post-comment"]');
        if (btn) act(btn);
      }
    });

    // ── Router ───────────────────────────────────────────────────────────
    function route() {
      var hash = location.hash || '#/';
      var m = hash.match(/^#\/d\/([^/?]+)/);
      if (m) loadDetail(decodeURIComponent(m[1]));
      else if (hash === '#/new') showNew();
      else showHome();
    }
    window.addEventListener('hashchange', route);
    route();
  })();
  </script>
</body>
</html>
